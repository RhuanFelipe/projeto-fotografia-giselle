services:
  mysql:
    image: mysql:8.0
    container_name: fotografia_mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: fotografia
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: laravel
      MYSQL_PASSWORD: password
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    volumes:
      - mysql_dados:/var/lib/mysql
    networks:
      - fotografia_rede

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: fotografia_phpmyadmin
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
    depends_on:
      - mysql
    networks:
      - fotografia_rede

volumes:
  mysql_dados:
    driver: local

networks:
  fotografia_rede:
    driver: bridge

